name = "new-lmage"
compatibility_date = "2023-01-01"
main = "build/index.js"

[vars]
# 生产环境环境变量
TG_Bot_Token = "8859657937:AAGo-u8oMjjXV-257hvBAkLxXBPffbjNzec"
TG_Chat_ID = "-1002509744447"
JWT_SECRET = "laowang-hardcore-jwt-secret-key-9527"
# 图片状态管理开关（默认关闭 = 纯图床模式：上传后永久托管，访问路径零状态校验）
# 设为 "on" 时启用封禁/回收站拦截与点击统计（每次访问需查 D1 状态）
FILE_STATUS_CHECK = "off"

[[d1_databases]]
binding = "DB"
database_name = "image"
database_id = "484dd7ca-eb1f-41bf-b913-9b1edcc36da1"

[build]
command = "node build-platform.js"

[assets]
directory = "./client/dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/upload", "/file/*"]
not_found_handling = "single-page-application"